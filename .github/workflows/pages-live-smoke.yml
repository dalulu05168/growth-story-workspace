name: Pages publish and smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  # Superseded PR checks may be cancelled; never cancel a production publish halfway through.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.55.1-noble
      options: --ipc=host
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:gate
      - run: npm run build:static
      - run: npm run test:prelogin
      - name: Capture responsive UI preview screenshots (synthetic fixtures only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workspace-ui-preview-${{ github.sha }}
          path: evidence/*.png
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: pages-${{ github.sha }}
          path: dist/pages/
          include-hidden-files: true

  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages-branch
      - uses: actions/download-artifact@v4
        with:
          name: pages-${{ github.sha }}
          path: pages-artifact
      - name: Publish validated static files
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          rsync -a --delete --exclude=.git pages-artifact/ pages-branch/
          cd pages-branch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          if ! git diff --cached --quiet; then
            git commit -m "Publish validated source $SOURCE_SHA"
            git push origin HEAD:gh-pages
          fi
      - name: Request Pages build after bot publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"

  smoke:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build:static
      - name: Check published Pages release
        env:
          RELEASE_CHECK_ATTEMPTS: '30'
        run: |
          node scripts/verify-release.cjs https://nuvexapro.com/
      - run: npx playwright install --with-deps chromium
      - name: Check rejected login on Pages origin
        run: |
          E2E_URL=https://nuvexapro.com/ npm run test:public-login
