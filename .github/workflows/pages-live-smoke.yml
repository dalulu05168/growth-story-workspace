name: Pages live smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-live-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Wait for Pages propagation
        run: sleep 20
      - name: Test live Pages
        run: |
          cat > /tmp/live-smoke.cjs <<'NODE'
          const { chromium } = require('playwright');
          const assert = require('node:assert/strict');
          const URL = 'https://dalulu05168.github.io/growth-story-workspace/';
          (async()=>{
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage({viewport:{width:1280,height:800}});
            const pageErrors=[];
            page.on('pageerror',e=>pageErrors.push('pageerror: '+e.message));
            page.on('console',m=>{ if(m.type()==='error') pageErrors.push('console: '+m.text()); });

            await page.goto(URL+'?live-smoke='+Date.now(),{waitUntil:'networkidle',timeout:60000});
            await page.waitForSelector('#authRoot',{state:'visible',timeout:15000});
            await page.waitForSelector('#loginForm',{state:'visible',timeout:15000});
            assert.equal(await page.locator('input[name="user"]').inputValue(),'chennan118');
            assert.equal(await page.locator('input[type="password"]').count(),1);
            assert.equal(await page.locator('input[name*="otp" i],input[name*="totp" i],input[placeholder*="验证码"]').count(),0);

            await page.fill('input[name="user"]','__live_smoke_invalid__');
            await page.fill('input[type="password"]','not-the-password');
            await page.click('#loginForm button');
            await page.waitForFunction(()=>document.querySelector('#authError')?.textContent?.trim().length>0,{timeout:15000});
            const errText=(await page.locator('#authError').textContent()||'').trim();
            assert.ok(!errText.includes('正在验证'), 'invalid login must finish with an error');

            await page.evaluate(()=>{
              document.querySelector('#authRoot')?.remove();
              const app=document.querySelector('.app');
              app?.classList.remove('app-lock');
              app?.classList.add('app-ready');
            });

            const pages=['overview','people','groups','records','novel','topics','tradeRecommend','holdingsV2'];
            for(const id of pages){
              const btn=page.locator('.nav button[data-page="'+id+'"]');
              assert.equal(await btn.count(),1,'missing nav '+id);
              await btn.click();
              await page.waitForTimeout(80);
              assert.ok(await page.locator('#'+id).evaluate(el=>el.classList.contains('active')),'nav failed '+id);
            }

            const collapse=page.locator('.nav-collapse');
            assert.equal(await collapse.count(),1,'missing collapse button');
            await collapse.click();
            await page.waitForTimeout(300);
            const desktopWidth=await page.locator('.sidebar').evaluate(el=>el.getBoundingClientRect().width);
            assert.ok(desktopWidth<100,'desktop sidebar did not collapse: '+desktopWidth);

            await page.setViewportSize({width:390,height:844});
            await page.waitForTimeout(400);
            const dims=await page.evaluate(()=>({
              viewport:innerWidth,
              scroll:document.documentElement.scrollWidth,
              sidebar:document.querySelector('.sidebar')?.getBoundingClientRect().width||0
            }));
            assert.ok(dims.scroll<=dims.viewport+2,'mobile horizontal overflow '+JSON.stringify(dims));
            assert.ok(dims.sidebar<=80,'mobile sidebar too wide '+JSON.stringify(dims));

            assert.equal(pageErrors.length,0,'runtime errors: '+pageErrors.join(' | '));
            console.log(JSON.stringify({ok:true,login:true,navigation:pages.length,desktopWidth,mobile:dims}));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node /tmp/live-smoke.cjs
