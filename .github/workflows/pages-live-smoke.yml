name: Pages live smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-live-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Wait for Pages propagation
        run: sleep 20
      - name: Test live Pages
        run: |
          cat > live-smoke.cjs <<'NODE'
          const { chromium } = require('playwright');
          const assert = require('node:assert/strict');
          const URL = 'https://dalulu05168.github.io/growth-story-workspace/';
          (async()=>{
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage({viewport:{width:1280,height:800}});
            const pageErrors=[];
            page.on('pageerror',e=>pageErrors.push('pageerror: '+e.message));
            page.on('console',m=>{ if(m.type()==='error') pageErrors.push('console: '+m.text()); });

            await page.goto(URL+'?live-smoke='+Date.now(),{waitUntil:'networkidle',timeout:60000});
            await page.waitForSelector('#authRoot',{state:'visible',timeout:15000});
            await page.waitForSelector('#loginForm',{state:'visible',timeout:15000});
            assert.equal(await page.locator('input[name="user"]').inputValue(),'');
            assert.equal(await page.locator('input[type="password"]').count(),1);
            assert.equal(await page.locator('input[name*="otp" i],input[name*="totp" i],input[placeholder*="验证码"]').count(),0);
            const themePicker=page.locator('.auth-theme-control [data-theme-switcher]');
            assert.equal(await themePicker.locator('option').count(),3,'login must expose all three themes');
            for(const theme of ['modern','dark','ink']){
              await themePicker.selectOption(theme);
              assert.equal(await page.locator('html').getAttribute('data-theme'),theme,'theme did not apply on login: '+theme);
              assert.equal(await page.evaluate(()=>localStorage.getItem('chennan-theme')),theme,'theme preference did not persist: '+theme);
            }

            await page.fill('input[name="user"]','__live_smoke_invalid__');
            await page.fill('input[type="password"]','not-the-password');
            await page.click('#loginForm button');
            await page.waitForFunction(()=>{const t=document.querySelector('#authError')?.textContent?.trim()||'';return t.length>0&&!t.includes('正在验证')},{timeout:15000});
            const errText=(await page.locator('#authError').textContent()||'').trim();
            assert.ok(!errText.includes('正在验证'), 'invalid login must finish with an error');
            pageErrors.length=0; // expected invalid-login 401 cleared

            await page.evaluate(()=>{
              document.querySelector('#authRoot')?.remove();
              const app=document.querySelector('.app');
              app?.classList.remove('app-lock');
              app?.classList.add('app-ready');
            });

            const pages=['overview','people','groups','records','novel','topics','tradeRecommend','holdingsV2'];
            for(const id of pages){
              const btn=page.locator('.nav button[data-page="'+id+'"]');
              assert.equal(await btn.count(),1,'missing nav '+id);
              await btn.click();
              await page.waitForTimeout(80);
              assert.ok(await page.locator('#'+id).evaluate(el=>el.classList.contains('active')),'nav failed '+id);
            }

            const collapse=page.locator('.nav-collapse');
            assert.equal(await collapse.count(),1,'missing collapse button');
            await collapse.click();
            await page.waitForTimeout(300);
            const desktopWidth=await page.locator('.sidebar').evaluate(el=>el.getBoundingClientRect().width);
            assert.ok(desktopWidth<100,'desktop sidebar did not collapse: '+desktopWidth);

            await page.setViewportSize({width:390,height:844});
            await page.waitForTimeout(400);
            const dims=await page.evaluate(()=>({
              viewport:innerWidth,
              scroll:document.documentElement.scrollWidth,
              sidebar:document.querySelector('.sidebar')?.getBoundingClientRect().width||0
            }));
            assert.ok(dims.scroll<=dims.viewport+2,'mobile horizontal overflow '+JSON.stringify(dims));
            assert.ok(dims.sidebar<=80,'mobile sidebar too wide '+JSON.stringify(dims));
            // business-layer-smoke: use public synthetic data in this temporary browser only.
            await page.setViewportSize({width:1280,height:800});
            await page.evaluate(async()=>{
              const src=await fetch('./data/people.json?smoke='+Date.now()).then(r=>r.json());
              const list=Array.isArray(src)?src:(src.people||[]);
              db.people=list.map(normalizePerson);
              db.records=[];db.dailyDocs={};db.customGroups=[];
              db.portfolio={holdings:[],buyPlans:[],settings:{}};
              db.tradeSim={offers:[],recommendations:[]};
              render();
              window.ChenNanDocumentWorkspace?.refresh?.();
            });
            assert.equal(await page.evaluate(()=>db.people.length),70,'people dataset must load 70');

            await page.locator('.nav button[data-page="novel"]').click();
            await page.waitForSelector('#dailyEditor',{state:'visible'});
            assert.equal(await page.locator('#speechRanking .speech-row').count(),70,'speech ranking must show all people');
            await page.locator('#dailyEditor').fill('21：今天保持谨慎，确认参与过大宗交易。');
            page.once('dialog',d=>d.accept());
            await page.click('#saveDaily');
            await page.waitForTimeout(150);
            const speech1=await page.evaluate(()=>{
              const p=db.people.find(x=>String(x.legacy_id)==='21');
              return db.records.filter(r=>String(r.personId)===String(p.id)&&r.type==='发言记录').length;
            });
            assert.equal(speech1,1,'first daily speech must count once');
            await page.locator('#speechRanking .speech-row[data-sp="FR0021"]').click();
            assert.ok((await page.locator('#personFrequency').textContent()).includes('1次'),'person frequency must be 1');
            assert.ok((await page.locator('#memoryTimeline').textContent()).includes('今天保持谨慎'),'memory timeline must contain speech');
            page.once('dialog',d=>d.accept());
            await page.click('#saveDaily');
            await page.waitForTimeout(120);
            const speech2=await page.evaluate(()=>{
              const p=db.people.find(x=>String(x.legacy_id)==='21');
              return db.records.filter(r=>String(r.personId)===String(p.id)&&r.type==='发言记录').length;
            });
            assert.equal(speech2,1,'resaving same day must not duplicate speech');

            await page.locator('.nav button[data-page="people"]').click();
            await page.waitForSelector('[data-open-person="FR0021"]');
            await page.locator('[data-open-person="FR0021"]').click();
            await page.waitForSelector('#personDetailPage.active');
            assert.ok((await page.locator('#personDetailContent').textContent()).includes('今天保持谨慎'),'growth journey must contain document memory');

            await page.evaluate(()=>{
              db.tradeSim={offers:[{
                id:'smoke-offer',symbol:'DDD',name:'DDD',market:'美股',currency:'USD',
                discountPct:15,minShares:100,holdDays:3,unitPrice:65,participantCount:10,
                createdAt:new Date().toISOString()
              }],recommendations:[]};
              db.portfolio.holdings=[];db.portfolio.buyPlans=[];
              render();
            });
            await page.locator('.nav button[data-page="tradeRecommend"]').click();
            await page.waitForSelector('#tradeRecommend.active');
            const tradeText=await page.locator('#tradeRecommendBody').textContent();
            for(const t of ['DDD','折扣 15%','最低 100股','持有3天','10人'])assert.ok(tradeText.includes(t),'missing trade rule '+t);

            await page.evaluate(()=>{
              db.portfolio.holdings=[{
                id:'smoke-holding',batchId:'smoke-batch',offerId:'smoke-offer',personId:'FR0021',
                symbol:'DDD',name:'DDD',market:'美股',currency:'USD',quantity:150,buyPrice:65,
                buyAt:new Date().toISOString(),
                plannedSellAt:new Date(Date.now()+3*86400000).toISOString(),
                status:'holding'
              }];
              render();
            });
            await page.locator('.nav button[data-page="holdingsV2"]').click();
            await page.waitForSelector('#holdingsV2.active');
            const sell=page.locator('[data-sell-batch]').first();
            assert.equal(await sell.count(),1,'holding batch must expose sell control');
            assert.ok(await sell.isDisabled(),'sell must be locked before hold period ends');


            assert.equal(pageErrors.length,0,'runtime errors: '+pageErrors.join(' | '));
            console.log(JSON.stringify({ok:true,login:true,navigation:pages.length,desktopWidth,mobile:dims}));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node ./live-smoke.cjs
