name: Isolated acceptance
on:
  push:
    branches: [fix/v23-acceptance, main]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write

jobs:
  static-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:gate

  unit-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test

  deployment-hash:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    needs: [static-gate, unit-regression]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        origin: [https://nuvexapro.com/, https://growth-story-workspace.vercel.app/]
    name: release-${{ matrix.origin }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run build:static
      - name: Verify complete published release
        env:
          ORIGIN: ${{ matrix.origin }}
          RELEASE_CHECK_ATTEMPTS: '30'
        run: node scripts/verify-release.cjs "$ORIGIN"

  browser-current:
    needs: [static-gate, unit-regression, deployment-hash]
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.55.1-noble
      options: --ipc=host
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        stage: [intro, prelogin, login, memory, navigation, business, security, offline]
      max-parallel: 1
    name: browser-${{ matrix.stage }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Provision isolated account via GitHub identity
        if: ${{ matrix.stage != 'intro' && matrix.stage != 'prelogin' }}
        run: node tests/create-e2e-credentials.cjs
      - name: Run current acceptance stage
        env:
          E2E_STAGE: ${{ matrix.stage }}
          E2E_CREDENTIALS: /tmp/chennan-e2e.json
          E2E_URL: https://growth-story-workspace.vercel.app/
        run: |
          case "$E2E_STAGE" in
            business) node tests/business-e2e.cjs && node tests/planning-e2e.cjs ;;
            security) node tests/security-e2e.cjs ;;
            offline) node tests/offline-e2e.cjs ;;
            *) node tests/current-e2e.cjs ;;
          esac
      - name: Revoke test account and delete synthetic data
        if: ${{ always() && matrix.stage != 'intro' && matrix.stage != 'prelogin' }}
        run: node tests/create-e2e-credentials.cjs cleanup
