name: Isolated acceptance
on:
  push:
    branches: [fix/v23-acceptance, main]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write

jobs:
  static-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:gate

  unit-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test

  browser-memory:
    needs: [static-gate, unit-regression]
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Provision isolated account via GitHub identity
        run: node tests/create-e2e-credentials.cjs
      - name: Wait for Pages propagation
        if: github.ref == 'refs/heads/main'
        run: sleep 45
      - name: Current browser and cloud memory acceptance
        env:
          E2E_CREDENTIALS: /tmp/chennan-e2e.json
          E2E_URL: ${{ github.ref == 'refs/heads/main' && 'https://dalulu05168.github.io/growth-story-workspace/' || 'http://127.0.0.1:18768/' }}
        run: |
          python3 -m http.server 18768 --bind 127.0.0.1 > /tmp/http.log 2>&1 &
          node tests/current-e2e.cjs
      - name: Revoke test account and delete synthetic data
        if: always()
        run: node tests/create-e2e-credentials.cjs cleanup
